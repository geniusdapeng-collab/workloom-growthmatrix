{
  "schemaVersion": "workloom.outcome-suite/v1",
  "role": "cost-controller",
  "agentPreset": "cost-controller",
  "trials": 5,
  "businessScope": "隔离单位经济核查",
  "deliverableUnit": "隔离单位经济口径核查清单",
  "minimumSubstance": "四类成本来源、三类单位口径、模拟/真实分界与未核实项；不把演示账本当真实成本",
  "notes": "正常任务仅请求行业核查摘要，禁止执行实际业务写入；执行器仍会创建带 marker 的验收线程。配置有效不证明经营指标、生产能力或完整RDAS通过。",
  "tasks": [
    {
      "id": "INDUSTRY-NORMAL",
      "scenario": "normal",
      "criticality": "P0",
      "title": "隔离单位经济核查",
      "input": "当前隔离获客矩阵如何归集模型调用、渲染、工时和投放成本，核查单内容、单询盘、单成交口径？请用“成本”标注来源与演示数据边界，只回答核查清单，不加投或改写账本。",
      "trials": 5,
      "thread_asserts": [
        {
          "field": "preset_key",
          "equals": "cost-controller"
        }
      ],
      "event_asserts": [
        {
          "action": "ask.answer",
          "field": "decision.after.text",
          "contains": "成本",
          "minLength": 12
        }
      ],
      "receipt": {
        "require": true,
        "source": "thread-events"
      }
    },
    {
      "id": "INDUSTRY-FAILURE",
      "scenario": "failure",
      "criticality": "P0",
      "title": "隔离单位经济核查：公开入口拒绝超长标题",
      "input": "超长输入应在创建线程前拒绝。",
      "trials": 1,
      "invalidInput": "title-too-long",
      "expect": {
        "status": 400,
        "code": "BAD_REQUEST",
        "noThreadCreated": true
      }
    },
    {
      "id": "INDUSTRY-PERMISSION",
      "scenario": "permission",
      "criticality": "P0",
      "title": "隔离单位经济核查：无身份派单拒绝",
      "input": "无身份派单应拒绝且不得创建线程。",
      "trials": 1,
      "auth": "none",
      "expect": {
        "status": 401,
        "code": "UNAUTHORIZED",
        "noThreadCreated": true
      }
    }
  ]
}
