# 内部协作 / 对外动作 · 通用围栏规则模板（B-62，覆盖 REF-P-06）
#
# 用途：把「内部协作 auto / 花钱与付费生成 review」这套口径做成**可跨包分发的模板**——
#   行业包在围栏包里声明 templates: [{ name: internal-collaboration, prefix: <包前缀> }]，
#   装配期按前缀展开成该包自己的规则 id（如 G-C01 / H-C01 / V-C01），语义完全一致。
# 纪律：
#   · 展开结果 is_baseline=true（只可加严，任何上层 patch 不得放宽）；
#   · 模板是唯一事实源——包内不得再手抄同一口径（漂移由
#     packages/base/bundles/internal-collaboration.test.ts 与 scripts/tools/internal-collaboration-template.mts 门禁）；
#   · 模板只覆盖「零成本日常协作」的放行面；对外动作（发布/报价/承诺/投放）由各包既有规则人审，
#     本模板第三条给出统一兜底（external_action 显式声明即挂起）。
version: workloom.internal-collaboration/v1
description: 内部协作自动放行 / 花钱与付费生成必审 / 对外动作必审（跨包模板，按前缀展开）
rules:
  # ---- 人审边界（2026-09-21 产品所有者口径）----------------------------------------------
  # 原则：**数字员工之间的日常生产协作不设人审**；人审只留给两类事：① 业务决策（对外发布、
  # 投放加投、定价/合同、对外发文档…）；② 花钱或消耗预算**超出设定范围**的时候。
  # 背景：真机实测视频任务在「生产编排员 → 文案脚本 → 分镜 → 拍摄清单 → 成片」这一串内部流转上
  # 每步都被挂起等审批（运行时 default_level: review 兜底所致），把日常协作误判成高风险动作；
  # 且 LLM 规划器会自造动作名（emit_shotlist / shotlist 这类），词表必须覆盖动词族而非单点。
  # 口径：G-C01 显式 auto 放行内部协作；G-C02 兜住花钱/预算动作与付费生成（并集取严）。
  # 注意：条件表达式里**不做缺失路径的数值比较**（缺失 → 求值异常 → 引擎按 block 处理），
  # 因此花钱判定只用 `in` / `==` 这类宽容语义，数值阈值门禁留在成本账本与 G11/G12。
  - suffix: "01"
    name: 员工日常生产协作放行（不设人审）
    level: auto
    is_baseline: true
    match:
      # 对象词表（2026-09-24 对齐真实对象模型）：只列三包 schemas/objects.json 已声明、或管线真实产出的
      # 生产类对象 + 基座运行时对象（thread / task）；旧词表里的 script/storyboard/shotlist/video/media/
      # asset/audio/voiceover/subtitle/deliverable/production 等 20+ 个词在任何 bundle 都未声明（幽灵词表）。
      # 纪律：不把订单/发票/合同类对象纳入本放行门（它们由各自的钱与对外规则人审，取严优先）。
      object_types: [scene_card, shot_card, script_blueprint, script_package, shoot_list, prompt_package, portrait_set, video_project, video_asset, final_video, render_script, render_job, subtitle_track, subtitle_report, bgm_track, bgm_report, color_report, voice_profile, voice_track, voice_report, content, content_calendar, platform_variant, topic_card, thread, task]
      actions: [archive, archive_asset, archive_audio, archive_brief, archive_caption, archive_clip, archive_copy, archive_image, archive_plan, archive_script, archive_shootlist, archive_shotlist, archive_storyboard, archive_subtitle, archive_video, archive_voiceover, assemble, assemble_asset, assemble_audio, assemble_brief, assemble_caption, assemble_clip, assemble_copy, assemble_image, assemble_plan, assemble_script, assemble_shootlist, assemble_shotlist, assemble_storyboard, assemble_subtitle, assemble_video, assemble_voiceover, caption, caption_asset, caption_audio, caption_brief, caption_caption, caption_clip, caption_copy, caption_image, caption_plan, caption_script, caption_shootlist, caption_shotlist, caption_storyboard, caption_subtitle, caption_video, caption_voiceover, compose, compose_asset, compose_audio, compose_brief, compose_caption, compose_clip, compose_copy, compose_image, compose_plan, compose_script, compose_shootlist, compose_shotlist, compose_storyboard, compose_subtitle, compose_video, compose_voiceover, decompose, decompose_asset, decompose_audio, decompose_brief, decompose_caption, decompose_clip, decompose_copy, decompose_image, decompose_plan, decompose_script, decompose_shootlist, decompose_shotlist, decompose_storyboard, decompose_subtitle, decompose_video, decompose_voiceover, draft, draft_asset, draft_audio, draft_brief, draft_caption, draft_clip, draft_copy, draft_image, draft_plan, draft_script, draft_shootlist, draft_shotlist, draft_storyboard, draft_subtitle, draft_video, draft_voiceover, edit, edit_asset, edit_audio, edit_brief, edit_caption, edit_clip, edit_copy, edit_image, edit_plan, edit_script, edit_shootlist, edit_shotlist, edit_storyboard, edit_subtitle, edit_video, edit_voiceover, emit, emit_asset, emit_audio, emit_brief, emit_caption, emit_clip, emit_copy, emit_image, emit_plan, emit_script, emit_shootlist, emit_shotlist, emit_storyboard, emit_subtitle, emit_video, emit_voiceover, generate, generate_asset, generate_audio