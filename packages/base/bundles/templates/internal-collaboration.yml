ist_plan, shootlist_script, shootlist_shootlist, shootlist_shotlist, shootlist_storyboard, shootlist_subtitle, shootlist_video, shootlist_voiceover, shotlist, shotlist_asset, shotlist_audio, shotlist_brief, shotlist_caption, shotlist_clip, shotlist_copy, shotlist_image, shotlist_plan, shotlist_script, shotlist_shootlist, shotlist_shotlist, shotlist_storyboard, shotlist_subtitle, shotlist_video, shotlist_voiceover, storyboard, storyboard_asset, storyboard_audio, storyboard_brief, storyboard_caption, storyboard_clip, storyboard_copy, storyboard_image, storyboard_plan, storyboard_script, storyboard_shootlist, storyboard_shotlist, storyboard_storyboard, storyboard_subtitle, storyboard_video, storyboard_voiceover, subcall, subcall_asset, subcall_audio, subcall_brief, subcall_caption, subcall_clip, subcall_copy, subcall_image, subcall_plan, subcall_script, subcall_shootlist, subcall_shotlist, subcall_storyboard, subcall_subtitle, subcall_video, subcall_voiceover, subtitle, subtitle_asset, subtitle_audio, subtitle_brief, subtitle_caption, subtitle_clip, subtitle_copy, subtitle_image, subtitle_plan, subtitle_script, subtitle_shootlist, subtitle_shotlist, subtitle_storyboard, subtitle_subtitle, subtitle_video, subtitle_voiceover, visualwrite.generate]
    when: "true"
    note: 数字员工之间的日常流转（脚本/分镜/拍摄清单/成片/物料/质检/交接）自动放行；对外发布、投放加投、定价合同、对外发文档仍由各自规则人审

  - suffix: "02"
    name: 花钱/预算类动作与付费生成必审
    level: review
    is_baseline: true
    match:
      # 对象词表（2026-09-24 对齐真实对象模型，与 G-C01 同口径）：生产类对象用真名；
      # 花钱/预算/结算类对象用真实存在的账本与单据对象（budget/cost_ledger/purchase/credit_account 等幽灵词已剔除）。
      object_types: [scene_card, shot_card, script_blueprint, script_package, shoot_list, prompt_package, portrait_set, video_project, video_asset, final_video, render_script, render_job, subtitle_track, subtitle_report, bgm_track, bgm_report, color_report, voice_profile, voice_track, voice_report, content, content_calendar, platform_variant, topic_card, thread, task, ads_campaign, budget_ledger, deal_order, deal_milestone, settlement_statement, invoice, order, booking_order, commercial_doc]
      actions: [archive, archive_asset, archive_audio, archive_brief, archive_caption, archive_clip, archive_copy, archive_image, archive_plan, archive_script, archive_shootlist, archive_shotlist, archive_storyboard, archive_subtitle, archive_video, archive_voiceover, assemble, assemble_asset, assemble_audio, assemble_brief, assemble_caption, assemble_clip, assemble_copy, assemble_image, assemble_plan, assemble_script, assemble_shootlist, assemble_shotlist, assemble_storyboard, assemble_subtitle, assemble_video, assemble_voiceover, budget.adjust, budget.topup, caption, caption_asset, caption_audio, caption_brief, caption_caption, caption_clip, caption_copy, caption_image, caption_plan, caption_script, caption_shootlist, caption_shotlist, caption_storyboard, caption_subtitle, caption_video, caption_voiceover, compose, compose_asset, compose_audio, compose_brief, compose_caption, compose_clip, compose_copy, compose_image, compose_plan, compose_script, compose_shootlist, compose_shotlist, compose_storyboard, compose_subtitle, compose_video, compose_voiceover, credit.purchase, credits.topup, decompose, decompose_asset, decompose_audio, decompose_brief, decompose_caption, decompose_clip, decompose_copy, decompose_image, decompose_plan, decompose_script, decompose_shootlist, decompose_shotlist, decompose_storyboard, decompose_subtitle, decompose_video, decompose_voiceover, draft, draft_asset, draft_audio, draft_brief, draft_caption, draft_clip, draft_copy, draft_image, draft_plan, draft_script, draft_shootlist, draft_shotlist, draft_storyboard, draft_subtitle, draft_video, draft_voiceover, edit, edit_asset, edit_audio, edit_brief, edit_caption, edit_clip, edit_copy, edit_image, edit_plan, edit_script, edit_shootlist, edit_shotlist, edit_storyboard, edit_subtitle, edit_video, edit_voiceover, emit, emit_asset, emit_audio, emit_brief, emit_caption, emit_clip, emit_copy, emit_image, emit_plan, emit_script, emit_shootlist, emit_shotlist, emit_storyboard, emit_subtitle, emit_video, emit_voiceover, generate, generate_asset, generate_audio, generate_brief, generate_caption, generate_clip, generate_copy, generate_image, generate_plan, generate_script, generate_shootlist, generate_shotlist, generate_storyboard, generate_subtitle, generate_video, generate_voiceover, handoff, handoff_asset, handoff_audio, handoff_brief, handoff_caption, handoff_clip, handoff_copy, handoff_image, handoff_plan, handoff_script, handoff_shootlist, handoff_shotlist, handoff_storyboard, handoff_subtitle, handoff_video, handoff_voiceover, media.assemble, media.pack, order.pay, pack, pack_asset, pack_audio, pack_brief, pack_caption, pack_clip, pack_copy, pack_image, pack_plan, pack_script, pack_shootlist, pack_shotlist, pack_storyboard, pack_subtitle, pack_video, pack_voiceover, plan, plan_asset, plan_audio, plan_brief, plan_caption, plan_clip, plan_copy, plan_image, plan_plan, plan_script, plan_shootlist, plan_shotlist, plan_shots, plan_storyboard, plan_subtitle, plan_video, plan_voiceover, purchase.approve, purchase.create, qc, qc_asset, qc_audio, qc_brief, qc_caption, qc_clip, qc_copy, qc_image, qc_plan, qc_script, qc_shootlist, qc_shotlist, qc_storyboard, qc_subtitle, qc_video, qc_voiceover, render, render_asset, render_audio, render_brief, render_caption, render_clip, render_copy, render_image, render_plan, render_script, render_shootlist, render_shotlist, render_storyboard, render_subtitle, render_video, render_voiceover, review, review_asset, review_audio, review_brief, review_caption, review_clip, review_copy, review_image, review_plan, review_script, review_shootlist, review_shotlist, review_storyboard, review_subtitle, review_video, review_voiceover, scripting, scripting_asset, scripting_audio, scripting_brief, scripting_caption, scripting_clip, scripting_copy, scripting_image, scripting_plan, scripting_script, scripting_shootlist, scripting_shotlist, scripting_storyboard, scripting_subtitle, scripting_video, scripting_voiceover, shootlist, shootlist_asset, shootlist_audio, shootlist_brief, shootlist_caption, shootlist_clip, shootlist_copy, shootlist_image, shootlist_plan, shootlist_script, shootlist_shootlist, shootlist_shotlist, shootlist_storyboard, shootlist_subtitle, shootlist_video, shootlist_voiceover, shotlist, shotlist_asset, shotlist_audio, shotlist_brief, shotlist_caption, shotlist_clip, shotlist_copy, shotlist_image, shotlist_plan, shotlist_script, shotlist_shootlist, shotlist_shotlist, shotlist_storyboard, shotlist_subtitle, shotlist_video, shotlist_voiceover, spend.commit, storyboard, storyboard_asset, storyboard_audio, storyboard_brief, storyboard_caption, storyboard_clip, storyboard_copy, storyboard_image, storyboard_plan, storyboard_script, storyboard_shootlist, storyboard_shotlist, storyboard_storyboard, storyboard_subtitle, storyboard_video, storyboard_voiceover, subcall, subcall_asset, subcall_audio, subcall_brief, subcall_caption, subcall_clip, subcall_copy, subcall_image, subcall_plan, subcall_script, subcall_shootlist, subcall_shotlist, subcall_storyboard, subcall_subtitle, subcall_video, subcall_voiceover, subtitle, subtitle_asset, subtitle_audio, subtitle_brief, subtitle_caption, subtitle_clip, subtitle_copy, subtitle_image, subtitle_plan, subtitle_script, subtitle_shootlist, subtitle_shotlist, subtitle_storyboard, subtitle_subtitle, subtitle_video, subtitle_voiceover, topup, visualwrite.generate]
    when: "params.spend_category in ['budget', 'paid', 'cash', 'topup'] or context.spend_category in ['budget', 'paid', 'cash', 'topup'] or params.paid_generation == true or params.budget_requested == true"
    note: 步骤显式声明花钱/预算/付费生成时回到人审；零成本日常协作不受影响（与 G-C01 并集取严）。额度是否超范围由成本账本与预算围栏判定

  # ---- 素材制作放行（2026-09-21 产品所有者口径）----

  - suffix: "03"
    name: 对外动作必审（跨包兜底）
    level: review
    is_baseline: true
    match:
      object_types: [content, publish_task, ads, ads_campaign, commercial_doc, commitment, offer, deal_order, coupon_sku, inquiry, lead, battle_report, final_video, brand_kit, price_change, order]
      actions: [publish.execute, publish.dispatch, ads.boost, ads.budget.adjust, price.adjust, price.publish, order.refund, refund.apply, comm.commit, commitment.issue, quote.issue, content.publish, content.submit, collab.track, deal.sign, coupon.publish, lead.export, customer.touch, message.send]
    when: "context.external_action == true or params.external_action == true or params.face_public == true"
    note: 对外动作（发布/报价/承诺/投放/触达/导出）统一走人审：调用方在 context 或 params 显式声明 external_action=true 即挂起；各包既有专规则（G9/G-GEO1/G12 等）仍按更严者生效
