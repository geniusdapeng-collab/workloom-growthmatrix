# 获客主包·起步方式（segment-defaults）· ADD-P-14 / UX-03
# 用途：新增工作区按「起步方式」一键装配默认班组与预装技能；运行时仍全量过围栏瀑布（L8.3）。
# 纪律：P2 条件岗（lifecycle-growth-officer / growth-partnership-officer）默认不出场（DROP-P-02，
#       由 G-GROW7/G-GROW8 门禁控制激活）；客户可后续在技能市场自助加装。
version: geo-growth-segment-defaults/v1
segments:

  # ========== 获客起步：双域日更（GEO 能见度 + 社媒内容）==========
  growth_starter:
    label: 获客起步（双域日更）
    pitch: 先把「被搜到、被看到」跑起来：GEO 能见度日更 + 社媒内容日更 + 询盘承接一条链
    presets:
      - company-ceo
      - growth-lead
      - geo-researcher
      - geo-content-planner
      - publish-operator
      - private-domain-operator
      - data-board-officer
      - review-analyst
    skills_ordered:
      - geo-query-craft
      - ai-answer-rewrite
      - visibility-monitor
      - dual-entry-inquiry
      - growth-metrics
      - growth-review

  # ========== 本地生活：门店矩阵 + 到店转化 ==========
  local_business:
    label: 本地生活（门店矩阵）
    pitch: 门店号矩阵 + 直播卖券 + 私域承接：把同城流量变成到店核销
    presets:
      - company-ceo
      - growth-lead
      - geo-content-planner
      - publish-operator
      - live-producer
      - private-domain-operator
      - data-board-officer
      - creator-partner
    skills_ordered:
      - moments-post
      - live-commerce
      - cro-playbook
      - lead-scoring
      - growth-metrics

  # ========== B 端询盘：GEO 信源 + 线索转化 ==========
  b2b_lead:
    label: B 端询盘（GEO 信源）
    pitch: 让 AI 搜索与知识平台替你回答采购问题：信源配图 + 引用源 + 询盘转化
    presets:
      - company-ceo
      - growth-lead
      - geo-researcher
      - visibility-watcher
      - citation-analyst
      - source-distributor
      - lead-conversion-officer
      - review-analyst
    skills_ordered:
      - geo-query-craft
      - citation-reverse
      - geo-answer-card
      - entity-consistency-check
      - lead-scoring
      - dual-entry-inquiry

  # ========== 预算敏感：先蓄水、后获客 ==========
  budget_guard:
    label: 预算敏感（先蓄水）
    pitch: 每一分钱都要有证据：预算带 + 增量实验 + 周报复盘，先蓄水再放量
    presets:
      - company-ceo
      - growth-lead
      - growth-strategist
      - growth-experimenter
      - media-portfolio-manager
      - data-board-officer
      - review-analyst
    skills_ordered:
      - budget-portfolio
      - experiment-design
      - incrementality-measurement
      - growth-review
      - growth-metrics
