# 账号矩阵（ACT-B-07 / ADD-P-11）· 获客用增主包
# 分层来源：第一批《业务底盘与社媒作战矩阵》§8.2；防关联纪律 G16；频率纪律 R9。
# 用途：排期器按「同设备组/同网络组同一小时不并发」与单账号日上限做确定性校验；
#       分层容量进晨报与编制周报；账号新增/调整只改本文件并重跑治理门禁。
version: workloom.account-matrix/v1
layers:
  - { key: l1_brand,    label: L1 品牌层, duty: 品牌调性 / 产品展示 / 信任资质 / B 端, target: T6/T1/T8, discipline: "G9/G20 统一口径" }
  - { key: l2_store,    label: L2 门店层, duty: 日常运营 / 房态 / 本地热点 / OTA 店铺, target: T1/T3,   discipline: "G16 防关联；单账号日 ≤5" }
  - { key: l3_staff,    label: L3 人格层, duty: 幕后 / 口播 / 体验, target: T3/T2,                     discipline: "G20 人设审；员工授权" }
  - { key: l4_creator,  label: L4 达人层, duty: 探店 / 测评 / 联名, target: T2/T6,                     discipline: "G15 合约；G-AD1 广告标识" }
  - { key: l5_ugc,      label: L5 用户层, duty: 顾客 UGC 真实口碑, target: T6/T3,                      discipline: "授权与个人信息保护（G-AD2）" }
  - { key: l6_private,  label: L6 私域层, duty: 沉淀 / 唤醒 / 复购, target: T5/T1,                     discipline: "R9 频率；退订即停" }
  - { key: l7_source,   label: L7 信源层, duty: 搜索与 AI 引用信源, target: T7/T2,                     discipline: "G-GEO1/G-GEO2/G-GEO3" }
  - { key: l8_overseas, label: L8 海外层, duty: 出海获客, target: T2/T3,                              discipline: "本地化合规；AI 标识" }
