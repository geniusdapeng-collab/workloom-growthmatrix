# 协作纪律围栏包（B-62/B-71 · 内部协作 auto / 对外动作 review 的落地面）
#
# 口径（与《规模化协作设计》§9.2 同源）：
#   · 内部协作（同一工作区内、可回滚、不对外承诺）默认放行，但**必须有任务契约作排产依据**；
#   · 对外动作（发布/报价/承诺/投放）一律 review（既有 G9/G-GEO1/G12 等基线规则已覆盖）；
#   · 共享黑板的写入只能由唯一主写者执行，其他角色只能只读或走契约（G-BB1）。
# 命名说明：施工图原写「G-COL1/G-COL2」，但该 id 已被 ai-video 调色包占用（品牌 look / 覆盖原片），
#   规则 id 是全局身份（单调守卫、dry-run、fence_rules 主键都按它派生），故本包改用
#   G-CON1（契约强制）与 G-BB1（黑板单主写者），语义与施工图一致。
# DSL 求值语义同其余基线包：match 命中后求值 when；block > review > auto（deny 优先并集）；
#   路径缺失 → undefined，故本包统一采用 "显式声明才放行" 的 fail-closed 写法。
# workloom:stats:begin（由 scripts/generate-capabilities.mjs 生成，勿手改）
# 本包 3 条规则（基线 3 条） · 覆盖对象 47 类 / 动作 57 个
# workloom:stats:end
version: geo-growth-collaboration/v1
default_level: review
rules:
  - rule_id: G-CON1
    name: 跨岗排产必须带任务契约
    level: block
    is_baseline: true
    match:
      object_types: [task, task_list, content_calendar, publish_task]
      actions: [task.dispatch, calendar.schedule, publish.dispatch]
    when: "context.has_contract != true"
    note: >
      跨岗交付无契约禁止排产（G-CON1）。调用方在派工/排期动作的 context 里显式声明
      `has_contract: true`（且真实存在契约，由 service 层校验），否则熔断。代码侧同一纪律的
      守卫见 packages/base/collaboration/dispatch.ts#planDispatch（跨岗模式缺 contractId 直接抛错）。

  - rule_id: G-BB1
    name: 黑板单主写者（非主写者写入熔断）
    level: block
    is_baseline: true
    match:
      object_types: [blackboard_entry]
      actions: [blackboard.write, blackboard.entry.write]
    when: "context.blackboard_writer_declared == true and context.actor_id != context.blackboard_writer"
    note: >
      m3 黑板协作的单主写者纪律：同一时刻只允许一个 owner 写入共享黑板，其他角色只读或走契约
      （走契约写入由主写者代写）。调用方需在 context 声明 blackboard_writer_declared=true 与
      blackboard_writer=<preset_key>，及 actor_id；非主写者写入直接熔断。
      代码侧同一纪律见 packages/base/collaboration/dispatch.ts#blackboardWriteGuard。

  # ---- GEO 域内部产出放行面（B-62 模板的域内补齐，2026-09-24 · P 域实测缺口）----
  # 事故：内部协作模板的对象/动作词表沿用的是**媒体域**词汇（content/script/…），
  # 而 GEO 域自己的内部对象（geo_content / geo_queue / intel_card…）不在表内 →
  # LLM 规划的每一步写动作都「无规则命中 → default_level=review」，
  # 实测 T-104..T-107 全部挂在待放行（内部协作被误判为高风险动作）。
  # 口径：只放行**内部可逆产出**（草稿/分析/内部台账/自有队列/内部报告）；
  # 对外动作（发布 rpa./content.submit、投放 ads./budget.、达人触达 collab.track/outreach、
  # 客户报告 report.client、直播执行 live.*）与花钱动作仍由 G9/G-GEO1/G12/G-C02/G-AD1/G-AD2 等把关，
  # deny 优先并集取严——本规则是 auto，任何更严规则命中都仍然生效。
  - rule_id: G-CON2
    name: GEO 域内部产出放行（草稿/分析/内部台账，不设人审）
    level: auto
    is_baseline: true
    match:
      object_types: [geo, geo_queue, visibility, intel_card, answer, citation_list, evidence, brief, report,
                     roi, growth, matrix, portfolio, partnership, lifecycle, incrementality, ltv, conversion,
                     experiment, cro, creative, script, shootlist, clip, collab, conflict, captain, fleet, ceo,
                     decision, ip, touch, lead, source, alert, ai_task, action_list, archive, landing, offer,
                     nurture, poster]
      actions: [geo.rewrite, geo_queue.emit, answer.structure, citation_list.write, intel_card.emit,
                evidence.snapshot, brief.generate, report.weekly, report.monthly, roi.alert, visibility.alert,
                alert.emit, action_list.emit, ai_task.emit, growth.map.write, growth.plan.write,
                growth.review.write, growth.metrics.collect, matrix.plan.write, portfolio.plan.write,
                partnership.plan.write, partnership.report.write, lifecycle.plan.write,
                incrementality.report.write, ltv.report.write, conversion.report.write,
                experiment.card.write, experiment.result.write, experiment.backlog.write,
                cro.variant.write, creative.reedit, script.draft, shootlist.emit, clip.request.write,
                clip.trigger.declare, collab.brief.gen, conflict.emit, captain.score, fleet.scoreboard,
                ceo.briefing, ceo.decision, decision.escalate.write, ip.asset.register, touch.log,
                lead.score.write, lead.route.write, source.maintain, archive.write_back, landing.copy.write,
                offer.frame.write, nurture.sequence.write, poster.degrade.render]
    when: "true"
    note: >
      GEO 域内部产出（六段式改写、内部分发队列、情报卡、增长计划/复盘、实验卡、内部周报月报、
      授权台账登记、线索打分/路由、素材降级出图等）自动放行——这些都是可回滚、不出公网的自有资产。
      对外发布（G9/G-GEO1）、投放与预算（G12/G-C02）、达人合作合规（G-AD1/G-AD2）、
      客户口径报告（report.client 不在本清单）与直播执行（live.* 不在本清单）仍逐条人审。
