# 2026-10-07 产品所有者更新：成功渲染默认直接正式后期；不设源片或后期品质复评。
# 成片标题字幕围栏包（视频经理 · 字幕工位）
# 与 ai-video-baseline.yml / ai-video-color.yml / ai-video-bgm.yml 同口径：默认基线、只可加严、
# 命中取严（block > review > auto）；求值语义：匹配命中后求值 when（沙箱，禁任意代码），
# 写类动作无命中按 default_level。
version: ai-video-subtitle/v3
default_level: review
rules:
  - rule_id: G-SUB0
    name: 常规字幕/标题渲染直通（本地可逆动作）
    level: auto
    is_baseline: true
    match:
      object_types: [final_video, subtitle_track, subtitle_report, video_asset]
      actions: [subtitlewrite.plan, subtitlewrite.burn, subtitlewrite.title, subtitlewrite.danmaku, subtitlewrite.sticker, subtitlewrite.karaoke, subtitlewrite.best, subtitlewrite.sidecar, subtitlewrite.softmux]
    when: "true"
    note: 字幕/标题/弹幕/贴纸/卡拉OK/旁挂字幕文件（sidecar）/软字幕轨（softmux）都是工位本地、非破坏性、可回滚动作（原片只读 + 新文件 + 版本链），默认直通；品牌视觉锤变更（G-SUB1）、覆盖原片（G-SUB2）、实际字体/ASS/时间轴错误（G-SUB3）、日配额（G-SUB4）、字体许可不合规（G-SUB5）、事件时间错误（G-SUB6）叠加升级，deny 优先并集取严。未命中写动作的保守默认是 review，故此处必须显式声明 auto，否则干净渲染也被挂起。

  - rule_id: G-SUB1
    name: 品牌视觉锤（账号锁定字体）变更 / 字体库首次入片必审
    level: review
    is_baseline: true
    match:
      object_types: [subtitle_track, subtitle_report, final_video]
      actions: [subtitlewrite.plan, subtitlewrite.burn, subtitlewrite.title, subtitlewrite.danmaku, subtitlewrite.sticker, subtitlewrite.karaoke, subtitlewrite.best, subtitlewrite.sidecar, subtitlewrite.softmux]
    when: "params.license_reviewed == false or params.brand_font_change == true or params.font_library_new == true"
    note: 账号固定字体（品牌视觉锤）与片头字体是长期识别资产：首次启用新字体库、或改动账号锁定字体，属对外观感与法律风险变更，须人审（审批号随字幕报告归档）；已核验许可且未改锁定的复用自动放行。

  - rule_id: G-SUB2
    name: 覆盖原片禁止
    level: block
    is_baseline: true
    match:
      object_types: [final_video, video_asset]
      actions: [subtitlewrite.burn, subtitlewrite.title, subtitlewrite.danmaku, subtitlewrite.sticker, subtitlewrite.karaoke, subtitlewrite.best, subtitlewrite.sidecar, subtitlewrite.softmux]
    when: "params.overwrite_source == true or params.output_path in [params.input_path]"
    note: 原片只读是硬红线：字幕一律产出新文件并进版本链（画面重编码、音轨 copy），任何覆盖原片的调用一票否决。

  - rule_id: G-SUB3
    name: 字幕加工的实际字体、ASS 与时间轴必须可用
    level: block
    is_baseline: true
    match:
      object_types: [final_video, subtitle_report]
      actions: [subtitlewrite.burn, subtitlewrite.title, subtitlewrite.danmaku, subtitlewrite.sticker, subtitlewrite.karaoke, subtitlewrite.best, subtitlewrite.sidecar, subtitlewrite.softmux]
    when: "params.font_unreadable == true or params.ass_invalid == true or params.timeline_invalid == true"
    note: 2026-10-07：按请求实际渲染字幕/标题，不默认读源片画面作字号、行宽、对比度、安全区或字幕出现品质放行；旧 verify/skip_verify/布局偏好开关不触发品质阻塞。实际字体缺失、ASS 无效或请求时间轴无效仍失败，产物与源文件摘要留证。

  - rule_id: G-SUB4
    name: 单租户日字幕渲染配额熔断
    level: block
    is_baseline: true
    match:
      object_types: [final_video, render_job]
      actions: [subtitlewrite.burn, subtitlewrite.title, subtitlewrite.danmaku, subtitlewrite.sticker, subtitlewrite.karaoke, subtitlewrite.best]
    when: "context.tenant_daily_subtitle >= 60"
    note: 每租户每日 60 次字幕渲染上限（含字幕/标题/择优；单次含全片重编码，比配乐更快但批量更大），超限熔断并告警；上调须人审（工位产能保护）。旁挂字幕（sidecar）与软字幕轨（softmux）不计入本配额：前者只写文本文件、后者视频轨 copy，都不做全片重编码，纳入配额会白占额度（它们的产能与安全由 G-DLV3 的流复制合同与 G-DLV7 的复用证据管）。

  - rule_id: G-SUB5
    name: 字体许可不合规禁止入片
    level: block
    is_baseline: true
    match:
      object_types: [subtitle_track, subtitle_report]
      actions: [subtitlewrite.plan, subtitlewrite.burn, subtitlewrite.title, subtitlewrite.danmaku, subtitlewrite.sticker, subtitlewrite.karaoke, subtitlewrite.best, subtitlewrite.sidecar, subtitlewrite.softmux]
    when: "params.commercial_use == true and not contains_any(params.font_license, ['ofl-1.1', 'apache-2.0', 'vendor-free-commercial'])"
    note: "商用交付只允许白名单许可（OFL-1.1 / Apache-2.0 / 厂商免费商用授权）；NC、来源不明、未登记许可一律一票否决。DSL 语义：contains_any 的 haystack 非字符串（含字段缺失）→ false → 条件成立 → 阻断，即「没登记许可」按不合规处理（fail-closed）。字体文件本身不随产品分发（OFL 单售禁止），工位按 kit/fonts-pin.json 逐文件 sha256 获取。"

  - rule_id: G-SUB6
    name: 弹幕与贴纸事件时间必须合法
    level: block
    is_baseline: true
    match:
      object_types: [subtitle_report, final_video, video_asset]
      actions: [subtitlewrite.danmaku, subtitlewrite.sticker, subtitlewrite.best]
    when: "params.invalid_event_timing == true"
    note: 按用户请求保留并实际渲染事件，默认不按源片画面、密度、安全区打分裁剪内容或退回；真实非法时间格式或越界时间轴按工位输入合同失败。密度事实可以记录，不是品质已验收。
