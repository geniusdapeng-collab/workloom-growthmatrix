# 首日上岗（Day-1 Questline）内容包 · ai-video 行业内容
# 本文件由 work/extract-questline.mjs 从 apps/web/src/onboarding/questline.config.ts 机械迁移（B-63），
# 之后**以本文件为唯一事实源**：web 端改为经服务端读取本包，不再在客户端硬编码行业内容。
# 纪律：岗位/围栏/驳回枚举逐条对照行业包实物；示例数字必须 sampleIsDemo: true。
version: workloom.questline-ai-video/v1
extends: workloom.questline-base/v1
employees:
  - id: director
    presetKey: director
    title: 总导演
    duty: 把选题拆成剧本、分镜与镜头单，盯住整片节奏与验收。
    fences:
      - G8 · 渲染提交必审（烧算力）
      - G11 · 预算超限自动暂停提交
    tasks:
      - 生成一集剧本与分镜
      - 验收成片镜头
      - 核对预算消耗
    sample: 一集 60 秒短剧的剧本 + 18 个镜头的分镜表
    sampleIsDemo: true
  - id: render
    presetKey: render-operator
    title: 渲染师
    duty: 按镜头单提交渲染；每一步都吃算力，所以提交前一定来问您。
    fences:
      - G8 · 渲染提交必审
      - G11 · 单项目算力超预算暂停
    tasks:
      - 提交渲染批次
      - 检查渲染回执
      - 处理渲染失败重试
    sample: 昨晚 3 个批次的渲染回执 + 2 个失败镜头的重试方案
    sampleIsDemo: true
  - id: publish
    presetKey: publish-operator
    title: 发布专员
    duty: 把成片分发到各平台；公网发布与版权风险都由人审兜底。
    fences:
      - G9 · 公网发布必审
      - G16 · 矩阵账号防关联
    tasks:
      - 排期多平台发布
      - 核对版权与授权
      - 回查发布结果
    sample: 本周 4 条的发布排期 + 版权核验结果
    sampleIsDemo: true
  - id: compliance
    presetKey: compliance-officer
    title: 合规审核员
    duty: 在成片出厂前检查事实、版权与平台规则，发现红线直接拦下。
    fences:
      - 事实红线一票否决
      - 版权缺失不得发布
    tasks:
      - 审核待发布成片
      - 核对素材授权
      - 记录拦截原因
    sample: 本周拦截的 2 条风险片段 + 修改建议
    sampleIsDemo: true
  - id: metrics
    presetKey: metrics-watcher
    title: 数据看板官
    duty: 盯播放、完播与转化，把哪条内容真的赚钱讲清楚。
    fences:
      - 只读统计，不改渠道数据
    tasks:
      - 查看今日看板
      - 生成周复盘数据
      - 查异常波动
    sample: 近 7 天完播与转化曲线 + 三条爆款归因
    sampleIsDemo: true
goals:
  - id: ship-episode
    title: 本周交付一集成片
    metric: 一集从剧本到成片走完，且每步有回执
    ownerPresetKey: director
    ownerTitle: 总导演
    artifact: 成片 + 镜头单 + 渲染回执
    steps: 4
    approvals: 2
  - id: budget-safe
    title: 算力不超预算
    metric: 单项目算力消耗不越过预算上限
    ownerPresetKey: render-operator
    ownerTitle: 渲染师
    artifact: 算力消耗账单 + 超限暂停记录
    steps: 3
    approvals: 1
  - id: publish-clean
    title: 发布不出事
    metric: 公网发布全部经审，版权与平台规则零违规
    ownerPresetKey: publish-operator
    ownerTitle: 发布专员
    artifact: 发布排期 + 版权核验记录
    steps: 3
    approvals: 1
tasks:
  - id: script-episode
    title: 把本周选题写成剧本与分镜
    ownerPresetKey: director
    ownerTitle: 总导演
    steps: 3
    eta: 约 3 分钟
    artifact: 剧本 + 分镜表（可直接开工）
    approvals: 1
    credits: 18
    dispatchTitle: 生成本周选题的剧本与分镜表，整理镜头清单与预算预估，提交渲染前提请审批
  - id: render-batch
    title: 提交一批渲染并核对回执
    ownerPresetKey: render-operator
    ownerTitle: 渲染师
    steps: 3
    eta: 约 4 分钟
    artifact: 渲染回执 + 失败镜头重试方案
    approvals: 1
    credits: 24
    dispatchTitle: 按镜头单提交渲染批次并核对回执，整理失败镜头的重试方案，超预算部分提请审批
  - id: publish-plan
    title: 排期发布并核验版权
    ownerPresetKey: publish-operator
    ownerTitle: 发布专员
    steps: 3
    eta: 约 3 分钟
    artifact: 发布排期 + 版权核验记录
    approvals: 1
    credits: 12
    dispatchTitle: 整理本周多平台发布排期并核验版权与授权，公网发布前提交审批
rejectReasons:
  - code: fact.risk
    label: 事实红线风险
  - code: compliance.platform
    label: 平台合规风险
  - code: budget.over
    label: 预算超支
  - code: other
    label: 其他（我补一句）
