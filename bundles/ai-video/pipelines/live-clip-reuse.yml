# 直播切片复用管线（B-51）
# 直播回放 → 高表现片段识别 → 切片剪辑 → 合规预检 → G9/G12 审批发布 → 战报复盘。
# 每一步 = Quest 任务卡；发布/加投未过审一律挂起，不自动外发。
quest: live-clip-reuse
name: 直播切片复用管线
version: v1
description: 当日直播回放识别高表现片段→切片剪辑→送审预检→G9/G12 审批→分发→战报复盘；未审不发布
schedule: event-driven
steps:
  - step_key: replay-ingest
    name: 直播回放入库
    owner: post-editor
    outputs: [video_asset]
  - step_key: clip-select
    name: 高表现片段识别
    owner: post-editor
    outputs: [video_asset]
  - step_key: clip-edit
    name: 切片剪辑与包装
    owner: post-editor
    outputs: [video_asset]
  - step_key: compliance-precheck
    name: 送审预检（平台规则/广告标识/授权）
    owner: compliance-officer
    gate: G14
    outputs: [video_asset]
  - step_key: publish-approval
    name: 发布审批（公网发布必审）
    owner: publish-operator
    gate: G9
    outputs: [publish_task]
  - step_key: distribute
    name: 多平台分发
    owner: distribution-operator
    outputs: [publish_task]
  - step_key: clip-report
    name: 切片战报与复用复盘
    owner: review-analyst
    outputs: [insight]
