# AI 视频行业包 · 声明式自动化触发器（B-05b）
# 来源：scripts/seed-video.ts 的硬编码清单迁入；单包工作区（video-studio）加载 7 条，
# 组合工作区（geo-growth 主包）按任务键去重：与 geo 包同任务的采集/评论/CEO 节拍以主包为准。
version: workloom.triggers/v1
triggers:
  - id: tg-metrics-2h
    name: 账号数据每 2 小时采集
    schedule: "7 */2 * * *"
    action: { dispatch: metrics-watcher, template: metrics.collect }
    description: 播放/点赞/评论/分享/转化落时序账
  - id: tg-morning-0800
    name: 早八点经营战报
    schedule: "0 8 * * *"
    action: { dispatch: metrics-watcher, template: report.morning }
    description: 账号与内容日报推送经营群
  - id: tg-comments-30m
    name: 评论每 30 分钟采集分流
    schedule: "*/30 * * * *"
    action: { dispatch: comment-operator, template: comments.ingest }
    description: 评论采集 → 意图分类 → 四档分流
  - id: tg-live-clip-reuse
    name: 直播切片复用扫描
    schedule: "30 22 * * *"
    action: { dispatch: post-editor, template: clip.reuse.scan }
    description: 当日直播回放识别高表现片段 → 切片剪辑 → 次日送审/发布审批（G14/G9/G12）
  - id: tg-ceo-brief-0830
    name: 公司CEO 晨报 08:30
    schedule: "30 8 * * *"
    action: { beat: daily }
  - id: tg-ceo-queue-2h
    name: 公司CEO 业务关卡巡检 2h
    schedule: "7 */2 * * *"
    action: { beat: queue }
  - id: tg-ceo-deviation
    name: 公司CEO 目标偏差扫描
    schedule: "15 */4 * * *"
    action: { beat: deviation }
  - id: tg-ceo-breaker
    name: 公司CEO 自治熔断巡检
    schedule: "45 23 * * *"
    action: { beat: breaker }
